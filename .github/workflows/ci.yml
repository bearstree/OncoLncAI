name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,service]"
      - run: python -m pytest
      - run: python -m compileall -q src app
      - run: python -c "from app.main import run_demo; assert run_demo('lung adenocarcinoma')['replan_count'] == 1"
      - run: python scripts/build_public_package.py
      - run: python scripts/build_public_package.py --verify
      - run: cd dist/oncolncai_public && python -m pytest
      - run: python -c "import sys; sys.path.insert(0, 'dist/oncolncai_public/src'); import oncolncai; print(oncolncai.__name__)"
      - uses: actions/upload-artifact@v4
        with:
          name: oncolncai-public-source
          path: dist/oncolncai_public

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements.lock
      - run: PYTHONPATH=src python scripts/build_public_package.py
      - run: docker build --tag oncolncai:ci dist/oncolncai_public
      - run: docker run --rm oncolncai:ci python -c "from oncolncai.demo import run_offline_agent_demo; assert run_offline_agent_demo().replan_count == 1"
